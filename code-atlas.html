<title>코드 아틀라스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* layout: 화면 전체가 지도(캔버스)이고, 그 위에 HUD 패널이 3열(추적 · 지도 · 설명) 격자로 떠 있는 한 화면짜리 도구. 홀로그램 한 가지 룩만 쓴다. */
:root{
  color-scheme:dark;
  --void:#02080F; --deep:#06141F; --panel:rgba(4,17,27,.93); --panel-2:rgba(10,34,50,.9);
  --line:#1B5873; --line-soft:#103A4E;
  --holo:#5AD7FF; --holo-dim:#2E86A8; --ink:#DDF6FF; --ink-dim:#86B6CB; --ink-faint:#4F7F95;
  --trace:#FF8A3D; --api:#FFD166; --db:#D7A6FF; --svc:#5EEAD4; --mirror:#E8F4FF; --err:#FF6B6B;
  --font-display:'Chakra Petch','IBM Plex Sans KR',system-ui,sans-serif;
  --font-body:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font:400 13px/1.55 var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
#map.arr{cursor:move}
#map.point{cursor:pointer}

.hud{position:fixed;inset:0;pointer-events:none;display:grid;
  grid-template-columns:minmax(0,336px) minmax(0,1fr) minmax(0,376px);
  grid-template-rows:auto minmax(0,1fr) auto;gap:10px 14px;
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto;min-width:0}
.panel{position:relative;background:var(--panel);border:1px solid var(--line)}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none}
.panel::before{left:-1px;top:-1px;border-left:2px solid var(--holo);border-top:2px solid var(--holo)}
.panel::after{right:-1px;bottom:-1px;border-right:2px solid var(--holo);border-bottom:2px solid var(--holo)}
.eyebrow{font:500 10px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}

/* 상단 */
.brand{grid-area:1/1;padding:10px 14px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.brand-id{display:flex;align-items:baseline;gap:9px;font-family:var(--font-display);letter-spacing:.2em}
.brand-id b{font-weight:700;font-size:17px;color:var(--holo)}
.brand-id span{font-weight:500;font-size:12px;color:var(--ink-dim)}
.brand-stats{font:400 10px/1.4 var(--font-mono);color:var(--ink-faint);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.brand-stats b{color:var(--ink-dim);font-weight:500}

.search{grid-area:1/2;align-self:start;display:flex;align-items:center;gap:10px;padding:0 12px;height:48px;max-width:760px;width:100%;justify-self:center}
.search-ico{font:600 11px var(--font-mono);color:var(--holo);letter-spacing:.1em;flex:none}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;color:var(--ink);font:500 14px var(--font-body);outline:none}
.search input::placeholder{color:var(--ink-faint);font-weight:400}
.search kbd{font:500 10px var(--font-mono);color:var(--ink-faint);border:1px solid var(--line-soft);padding:2px 6px;flex:none}
.search .clear{font:500 11px var(--font-mono);color:var(--ink-dim);border:1px solid var(--line);padding:4px 8px;flex:none}
.search .clear:hover{color:var(--ink);border-color:var(--holo)}
.drop{position:absolute;left:-1px;right:-1px;top:calc(100% + 6px);background:rgba(3,14,23,.98);border:1px solid var(--line);max-height:min(64vh,520px);overflow:auto;z-index:5;padding:6px}
.drop h4{margin:8px 8px 6px;font:500 10px var(--font-mono);letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase}
.opt{display:flex;gap:10px;align-items:baseline;width:100%;padding:8px;border:1px solid transparent}
.opt:hover,.opt.on{background:var(--panel-2);border-color:var(--line)}
.opt .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.opt .meta{margin-left:auto;font:400 10px var(--font-mono);color:var(--ink-faint);flex:none;text-align:right}
.tag{flex:none;font:600 10px/1 var(--font-mono);letter-spacing:.06em;padding:4px 6px;border:1px solid currentColor}
.tag.q{color:var(--holo)} .tag.fix{color:var(--api)} .tag.err{color:var(--err)}
.drop p{margin:8px;color:var(--ink-faint);font-size:12px}

.level{grid-area:1/3;align-self:start;display:flex;align-items:stretch;height:48px}
.level button{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 8px;border-right:1px solid var(--line-soft);min-width:0}
.level button:last-of-type{border-right:0}
.level button i{font:500 9px var(--font-mono);font-style:normal;color:var(--ink-faint);letter-spacing:.1em}
.level button b{font:600 11px var(--font-display);letter-spacing:.14em;color:var(--ink-dim)}
.level button.on{background:linear-gradient(180deg,rgba(90,215,255,.18),rgba(90,215,255,.03))}
.level button.on b{color:var(--holo)} .level button.on i{color:var(--holo-dim)}
.level button:hover b{color:var(--ink)}

/* 좌/우 패널 */
.side{display:flex;flex-direction:column;min-height:0;max-height:100%;align-self:start}
.trace{grid-area:2/1} .insp{grid-area:2/3}
.side-head{padding:12px 14px 10px;border-bottom:1px solid var(--line-soft);display:flex;gap:10px;align-items:flex-start}
.side-head h2{margin:4px 0 0;font:600 16px/1.3 var(--font-display);letter-spacing:.02em;overflow-wrap:anywhere}
.side-head .x{margin-left:auto;font:500 11px var(--font-mono);color:var(--ink-dim);border:1px solid var(--line);padding:3px 7px;flex:none}
.side-head .x:hover{color:var(--ink);border-color:var(--holo)}
.side-head>div{min-width:0}
.side-head .x~.x{margin-left:0}
/* 접은 설명 패널: 이름 한 줄만 남기고 지도를 내준다 */
.insp.min .side-body,.insp.min .crumb{display:none}
.insp.min .side-head{border-bottom:0;align-items:center;padding:9px 12px;cursor:pointer}
.insp.min .side-head h2{margin:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-body{overflow:auto;padding:12px 14px 14px;display:flex;flex-direction:column;gap:14px;min-height:0;overscroll-behavior:contain}
.side-body h3{margin:0 0 6px;font:500 10px var(--font-mono);letter-spacing:.16em;color:var(--holo-dim);text-transform:uppercase;display:flex;gap:8px;align-items:center}
.side-body h3 em{font-style:normal;color:var(--ink-faint);letter-spacing:.04em;text-transform:none}
.side-body p{margin:0}
.path{font:400 11px/1.5 var(--font-mono);color:var(--ink-dim);overflow-wrap:anywhere}
.crumb{font:500 11px var(--font-mono);color:var(--ink-dim);letter-spacing:.02em}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px}
.kv dt{font:500 11px var(--font-body);color:var(--holo);white-space:nowrap}
.kv dd{margin:0;color:var(--ink)}
.src{font:400 12px/1.6 var(--font-body);color:var(--ink-dim);border-left:1px solid var(--line);padding-left:10px}
.badge{display:inline-block;font:600 9.5px/1 var(--font-mono);letter-spacing:.08em;padding:3px 5px;border:1px solid currentColor;vertical-align:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 8px;border:1px solid var(--line);font:500 11.5px var(--font-mono);color:var(--ink)}
.chip:hover{border-color:var(--holo);background:var(--panel-2)}
.chip i{width:6px;height:6px;background:var(--c,var(--holo));flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{color:var(--ink-faint);font-size:10px;flex:none}
.more{font:400 11px var(--font-mono);color:var(--ink-faint);align-self:center}
.xlink{display:grid;gap:6px}
.xrow{display:flex;gap:8px;align-items:baseline;width:100%;padding:6px 8px;border:1px solid var(--line-soft)}
.xrow:hover{border-color:var(--holo);background:var(--panel-2)}
.xrow .k{font:600 9.5px var(--font-mono);letter-spacing:.06em;flex:none;color:var(--c)}
.xrow .n{font:500 12px var(--font-mono);min-width:0;overflow-wrap:anywhere}
.xrow .r{display:block;font:400 10.5px var(--font-mono);color:var(--ink-dim)}
.mlist{display:grid;gap:1px}
.mrow{display:flex;gap:8px;align-items:baseline;width:100%;padding:4px 6px;font:400 11.5px var(--font-mono);border:1px solid transparent}
.mrow:hover{background:var(--panel-2)}
.mrow.on{border-color:var(--trace);background:rgba(255,138,61,.1)}
.mrow .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .l{margin-left:auto;color:var(--ink-faint);font-size:10px;flex:none;font-variant-numeric:tabular-nums}
.mrow .dot{width:6px;height:6px;flex:none;align-self:center}
.mdetail{margin:2px 0 8px;padding:8px;border:1px solid var(--line-soft);display:grid;gap:8px;font-size:12px}
.mdetail code{font:400 11px/1.5 var(--font-mono);color:var(--ink-dim);overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{font:600 11px var(--font-display);letter-spacing:.08em;padding:7px 10px;border:1px solid var(--line);color:var(--holo)}
.act:hover{border-color:var(--holo);background:rgba(90,215,255,.1)}
.act.on{border-color:var(--trace);color:var(--trace)}
.note{font-size:11.5px;color:var(--ink-faint);line-height:1.5}
.tag.ai{color:var(--svc)}
.aibar{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--svc);color:var(--svc);font:500 12px var(--font-body)}
.aibar .pulse{width:8px;height:8px;background:var(--svc);flex:none;animation:pulse 1.1s ease-in-out infinite}
.aibar .el{margin-left:auto;font:400 11px var(--font-mono);color:var(--ink-dim);font-variant-numeric:tabular-nums}
.aibar.err{border-color:var(--err);color:var(--err)}
.aibar.err .pulse{display:none}
@keyframes pulse{50%{opacity:.25}}
.act.ai{color:var(--svc);border-color:var(--svc)}
.act.ai:hover{background:rgba(94,234,212,.1)}
.act[disabled]{opacity:.5;cursor:default}
.mini-act{font:500 10px var(--font-mono);color:var(--ink-faint);border:1px solid var(--line-soft);padding:2px 6px;letter-spacing:0;text-transform:none;margin-left:auto}
.mini-act:hover{color:var(--ink);border-color:var(--holo)}
.lits{display:flex;flex-wrap:wrap;gap:5px}
.lit{font:400 11px/1.4 var(--font-body);color:var(--ink-dim);border:1px dashed var(--line);padding:2px 6px;max-width:100%;overflow-wrap:anywhere}

/* 추적 패널 */
.sum{font-size:13px;line-height:1.65}
.cause{display:grid;gap:6px}
.cz{display:block;width:100%;padding:8px 10px;border:1px solid var(--line-soft)}
.cz:hover{border-color:var(--trace);background:rgba(255,138,61,.07)}
.cz b{display:block;font-weight:600;color:var(--ink)}
.cz span{display:block;color:var(--ink-dim);font-size:12px;margin-top:2px}
.cz code{display:block;margin-top:4px;font:500 10.5px var(--font-mono);color:var(--trace)}
.steps{display:grid;gap:2px;counter-reset:s}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;width:100%;padding:6px 4px;border:1px solid transparent}
.step:hover{background:var(--panel-2)}
.step.on{border-color:var(--trace)}
.step .no{width:22px;height:22px;border:1px solid var(--trace);color:var(--trace);font:600 10.5px/20px var(--font-mono);text-align:center}
.step.br .no{border-style:dashed}
.step .who{font:500 12px var(--font-mono);overflow-wrap:anywhere}
.step .who small{font-size:10px;color:var(--c);margin-right:6px;letter-spacing:.04em}
.step .what{display:block;color:var(--ink-dim);font-size:12px;margin-top:1px}
.lane{margin:8px 0 2px;font:500 10px var(--font-mono);letter-spacing:.12em;color:var(--ink-faint)}

/* 하단 */
.minimap{grid-area:3/1;align-self:end;width:216px;padding:6px}
.minimap canvas{display:block;width:204px;height:128px;cursor:crosshair}
.legend{grid-area:3/2;align-self:end;justify-self:center;display:flex;gap:4px;padding:5px;max-width:100%;overflow-x:auto}
.lg{display:flex;align-items:center;gap:7px;padding:5px 9px;font:500 11px var(--font-body);color:var(--ink-dim);white-space:nowrap;border:1px solid transparent}
.lg i{width:16px;height:2px;background:var(--c);flex:none}
.lg[aria-pressed="false"]{opacity:.38}
.lg:hover{border-color:var(--line)}
.status{grid-area:3/3;align-self:end;justify-self:end;padding:7px 11px;font:400 10.5px/1.5 var(--font-mono);color:var(--ink-dim);text-align:right;font-variant-numeric:tabular-nums;max-width:100%}
.status b{color:var(--holo);font-weight:500}
.status .hint{color:var(--ink-faint)}
/* 실측 응답: 비정상은 붉은 네온 한 가지 색으로만 알린다 */
.rtbox{margin-top:2px;padding-top:6px;border-top:1px solid var(--line-soft);font:400 10.5px/1.5 var(--font-mono);color:var(--ink-dim);font-variant-numeric:tabular-nums}
.rtbox b{color:#FF5A6A;font-weight:600} .rtbox .ok{color:#6CF0C6}
.rtbox .mini-act{display:inline-block;margin:4px 6px 0 0}
.pendbox b{color:#FFB454}
/* 시스템 목록 · 배치 편집 */
.level .lvnav{flex:0 0 auto;flex-direction:row;align-items:center;gap:7px;padding:0 13px;margin-left:8px;border-left:1px solid var(--line);background:rgba(90,215,255,.07)}
.level .lvnav svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--holo);stroke-width:1.7;stroke-linejoin:round}
.level .lvnav b{color:var(--holo);letter-spacing:.08em}
.level .lvnav.on{background:linear-gradient(180deg,rgba(90,215,255,.3),rgba(90,215,255,.08))}
.navq{width:100%;background:transparent;border:1px solid var(--line);color:var(--ink);font:400 12px var(--font-mono);padding:7px 8px;outline:none}
.navq:focus{border-color:var(--holo)}
.srow .k{min-width:40px}
.srow[hidden]{display:none}
/* 설정 패널: 로컬 서버(atlas.py open)로 열었을 때만 쓴다 */
.cfg{position:fixed;inset:0;z-index:40;background:rgba(2,8,14,.8);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px))}
.cfg-box{width:min(780px,100%)}
.cfg-box .side-body{overflow:visible}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 8px;border:1px solid var(--line-soft);margin-top:-1px}
.crow .nm{flex:1 1 220px;min-width:0;font:500 12px var(--font-mono);overflow-wrap:anywhere}
.crow .nm small{display:block;font:400 10.5px/1.5 var(--font-mono);color:var(--ink-dim)}
.crow .mini-act,.cform .mini-act{margin-left:0;font-size:11px;padding:5px 8px;color:var(--ink-dim)}
.cfg input[type=text]{flex:1 1 180px;min-width:0;background:transparent;border:1px solid var(--line);color:var(--ink);font:400 12px var(--font-mono);padding:7px 8px;outline:none}
.cfg input[type=text]:focus{border-color:var(--holo)}
.cform{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dirs{max-height:240px;overflow:auto;border:1px solid var(--line-soft);margin:8px 0}
.dirs button{display:block;width:100%;text-align:left;padding:6px 9px;font:400 12px var(--font-mono);color:var(--ink);border-bottom:1px solid var(--line-soft)}
.dirs button:hover{background:var(--panel-2)}
.log{margin:6px 0 0;padding:8px;border:1px solid var(--line-soft);font:400 10.5px/1.5 var(--font-mono);color:var(--ink-dim);white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto}
.codes{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.xrow .r.codes{display:flex}
.code{font:500 10.5px/1.5 var(--font-mono);padding:0 6px;border:1px solid var(--line);color:var(--ink-dim);white-space:nowrap}
.code i{font-style:normal;color:var(--ink-faint);margin-left:3px}
.code.bad{color:#FF5A6A;border-color:#FF3B4E} .code.bad i{color:#FF8A95}
.mrow .l b{color:#FF5A6A;font-weight:500}
.stepnav{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line-soft);font:500 11px var(--font-mono);color:var(--ink-dim)}
.stepnav .mini-act,.walk .mini-act{margin-left:0;font-size:11px;padding:4px 8px;color:var(--ink-dim)}
.stepnav #stepno{color:var(--trace);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.stepnav .kh{margin-left:auto;color:var(--ink-faint);font-size:10px}
.walk{grid-area:2/2;align-self:end;justify-self:center;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 10px;max-width:100%;font:500 11px var(--font-mono);color:var(--ink-dim)}
.walk .wt{display:inline-flex;gap:7px;align-items:baseline;min-width:0;max-width:340px}
.walk .wt i{width:14px;height:2px;align-self:center;flex:none}
.walk .wt b{color:var(--ink);font:600 13px var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.walk .wt small,.walk .wh{color:var(--ink-faint);font-size:10px;white-space:nowrap}
.walk .wk b{color:var(--ink)}
.walk .mini-act.go{color:var(--holo);border-color:var(--holo)}
.walk .mini-act[disabled]{opacity:.4;cursor:default}
.scale{display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-top:6px;color:var(--ink-faint)}
.scale span{margin-right:4px}
.scale button{font:500 10px var(--font-mono);border:1px solid var(--line-soft);padding:2px 7px;color:var(--ink-dim)}
.scale button:hover{border-color:var(--holo);color:var(--ink)}
.scale button[aria-pressed="true"]{border-color:var(--holo);color:var(--holo)}
#tip{position:fixed;z-index:9;pointer-events:none;background:rgba(3,14,23,.96);border:1px solid var(--line);padding:5px 8px;font:500 11px var(--font-mono);max-width:300px}
#tip small{display:block;color:var(--ink-faint);font-weight:400}
.boot{position:fixed;inset:0;display:grid;place-items:center;font:500 12px var(--font-mono);letter-spacing:.2em;color:var(--holo-dim);pointer-events:none}

@media (max-width:860px){
  .hud{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px}
  .brand,.minimap,.status,.search kbd{display:none}
  .search{grid-area:1/1} .level{grid-area:2/1;height:40px} .legend{grid-area:4/1;justify-self:stretch}
  .trace,.insp{grid-area:3/1;align-self:end;max-height:min(100%,54vh)}
  .walk{grid-area:3/1;align-self:start} .walk .wh{display:none}
  .insp{z-index:2;background:#061723}      /* 좁은 화면에서는 왼쪽 패널과 같은 자리에 겹치므로 비치지 않게 한다 */
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<canvas id="map" aria-label="코드 구성도. 드래그로 이동하고 휠이나 핀치로 확대합니다."></canvas>
<div class="boot" id="boot">구성도를 펼치는 중</div>

<div class="hud" id="hud">
  <header class="brand panel">
    <div class="brand-id"><b id="brand-name">ATLAS</b><span>CODE ATLAS</span></div>
    <div class="brand-stats" id="stats">&nbsp;</div>
    <div class="rtbox" id="rtbox" hidden></div>
    <div class="rtbox pendbox" id="pendbox" hidden></div>
  </header>

  <div class="search panel" id="search">
    <span class="search-ico" aria-hidden="true">TRACE</span>

/* ───────────── 데이터 준비 ───────────── */
function prepare(recs){
  for (const r of recs){ if (r.rt==='meta') META = r; else if (r.rt==='unit') UNITS[r.i] = r; else EDGES.push(r); }
  for (const u of UNITS){ if (u.decl==='external') u.kind = 'external'; if (!KIND[u.kind]) u.kind = 'logic'; u.m = u.m||[]; u.out = []; u.in = []; byId.set(u.id, u); for (const m of u.m) m.callers = []; }
  EDGES.forEach((e,i) => { e.i = i; e.g = egroup(e.k); UNITS[e.s].out.push(e); UNITS[e.t].in.push(e); });
  for (const u of UNITS) u.m.forEach((m,mi) => {
    (m.c||[]).forEach(([t,tm]) => UNITS[t].m[tm] && UNITS[t].m[tm].callers.push([u.i,mi]));
    (m.h||[]).forEach(([t,tm]) => UNITS[t].m[tm] && UNITS[t].m[tm].callers.push([u.i,mi,1]));
  });
  for (const u of UNITS){
    for (const m of u.m){ m.open = !!m.route && !m.callers.some(c => c[2]); if (m.lit) m.xl = m.lit.join('\n').toLowerCase(); }
    let sl = u.id.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,''); if (!/-[A-Za-z0-9]/.test(sl) || bySlug.has(sl)) sl = 'u-' + u.i;

  const mm = new Map();

    const key = u.sys+'|'+u.mod; let m = mm.get(key);

  }

    if (a.sys !== b.sys){ const k = a.sys+'|'+b.sys+'|'+e.g; let x = sa.get(k); if (!x){ x = {a:SYS[a.sys],b:SYS[b.sys],g:e.g,w:0}; sa.set(k,x); } x.w += 1; }
  }

function packColumns(items, aspect, gx, gy){
  const total = items.reduce((s,i) => s+i.h+gy, 0); let best = null;
  for (let cols = 1; cols <= Math.min(14, items.length); cols++){
    const target = total/cols, arr = [[]]; let cur = 0;
    for (const it of items){ if (cur > 0 && cur+it.h > target*1.12 && arr.length < cols){ arr.push([]); cur = 0; } arr[arr.length-1].push(it); cur += it.h+gy; }
    const widths = arr.map(c => Math.max(...c.map(i => i.w))), heights = arr.map(c => c.reduce((s,i) => s+i.h+gy, -gy));
    const w = widths.reduce((s,x) => s+x+gx, -gx), h = Math.max(...heights), score = Math.abs(Math.log((w/h)/aspect));
    if (!best || score < best.score) best = {score, arr, widths, w, h};
  }
  let x = 0;
  best.arr.forEach((c,ci) => { let y = 0; for (const it of c){ it.x = x; it.y = y; y += it.h+gy; } x += best.widths[ci]+gx; });
  return best;
}
function cardH(u){ const n = u.m.length; return n ? CH + Math.min(n,MAXM)*MR + (n>MAXM?MR:0) + 10 : 34; }

function layout(){
  for (const m of MODS){
    for (const u of m.units){ u.w = CW; u.h = cardH(u); }
    const p = packColumns(m.units, 1.55, GX, GY);
    m.w = Math.max(p.w + MP*2, 420); m.h = p.h + MT + MP;
    for (const u of m.units){ u.rx = u.x + MP; u.ry = u.y + MT; }
  }
  for (const s of SYSL){
    if (!s.mods.length){ s.w = s.h = 0; continue; }
    const p = packColumns(s.mods, 1.45, MG, MG);
    s.w = Math.max(p.w + SPD*2, 1500); s.h = Math.max(p.h + STT + SPD, 1100);
    const ox = (s.w - p.w)/2, oy = STT + (s.h - STT - SPD - p.h)/2;
    for (const m of s.mods){ m.rx = m.x + ox; m.ry = m.y + oy; }
  }
  /* 시스템을 '부르는 쪽 → 불리는 쪽' 순서의 열로 놓는다. 시스템 사이의 API·DB·서비스·메시지 연결 방향으로 깊이를 매기고,
     기기 저장소는 맨 앞, 외부 서비스는 맨 뒤 열에 둔다. 작업 공간 메모(atlas-notes.json 의 columns)가 열을 정해 두었으면 그것을 따른다. */
  const baseIds = META.systems.filter(s => !s.base).map(s => s.id), rank = {}, outs = {};
  for (const id of baseIds){ rank[id] = 0; outs[id] = new Set(); }
  for (const e of SYSE){ const a = e.a.base || e.a.id, b = e.b.base || e.b.id; if (a !== b && outs[a] && b in rank && ['http','db','svc','msg'].includes(e.g)) outs[a].add(b); }
  for (let pass = 0; pass < baseIds.length; pass++){
    let moved = false;
    for (const a of baseIds) for (const b of outs[a]) if (rank[b] < rank[a] + 1 && rank[a] + 1 < baseIds.length){ rank[b] = rank[a] + 1; moved = true; }
    if (!moved) break;
  }
  const deepest = Math.max(1, ...baseIds.filter(id => id !== 'device' && id !== 'cloud').map(id => rank[id]));
  if ('device' in rank) rank.device = -1;
  if ('cloud' in rank) rank.cloud = deepest;
  let COLS = WSCOLS && WSCOLS.map(c => c.filter(id => id in rank)).filter(c => c.length);
  if (COLS){ const placed = new Set(COLS.flat()), rest = baseIds.filter(id => !placed.has(id)); if (rest.length) COLS.push(rest); }
  else COLS = [...new Set(baseIds.map(id => rank[id]))].sort((a,b) => a-b).map(r => baseIds.filter(id => rank[id] === r));
  const GAPX = 1300, GAPY = 800, GAPC = 3200, tag = k => k ? '@' + k : '';
  const sized = COLS.flat().map(id => SYS[id]).filter(s => s && s.w);
  const HT = WSCOLS ? Infinity : Math.max(Math.sqrt(sized.reduce((a,s) => a + (s.w+GAPX)*(s.h+GAPY), 0)/1.7), ...sized.map(s => s.h));   // 전체가 가로로 조금 긴 꼴이 되게 하는 열 높이
  const placeCluster = (k, ox, oy) => {
    let x = 0, hmax = 0;
    for (const col of COLS){
      const ss = col.map(id => SYS[id + tag(k)]).filter(s => s && s.w);
      if (!ss.length) continue;
      const subs = [[]]; let cur = 0;
      for (const s of ss){ if (cur > 0 && cur + s.h > HT){ subs.push([]); cur = 0; } subs[subs.length-1].push(s); cur += s.h + GAPY; }
      for (const sub of subs){
        const cw = Math.max(...sub.map(s => s.w)), chh = sub.reduce((a,s) => a+s.h+GAPY, -GAPY);
        let y = -chh/2; hmax = Math.max(hmax, chh);
        for (const s of sub){ s.x = ox + x + (cw - s.w)/2; s.y = oy + y; y += s.h + GAPY; }
        x += cw + GAPX;
      }
    }
    return {w:x - GAPX, h:hmax};
  };
  CLUSTER = placeCluster(0, 0, 0);
  const gcols = clamp(Math.round(Math.sqrt(SCALE*(CLUSTER.h/CLUSTER.w)*1.6)), 1, SCALE);

    else if (o.dataset.go != null){ cancelAI(); state.trace = null; state.hits = null; state.impact = null; renderTrace(); selectUnit(+o.dataset.go, o.dataset.gm != null ? +o.dataset.gm : null, true); } });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#search')) closeDrop(); });
  $('#qclear').addEventListener('click', () => { clearAll(); q.focus(); });
  addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#cfg').hidden){ closeConfig(); return; }
    if (e.target === q || (e.target.closest && e.target.closest('input,textarea,select'))) return;
    if (e.key === 'Escape' && state.arrange){ setArrange(false); return; }
    if (e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')){ e.preventDefault(); q.focus(); q.select(); }
    else if (e.key === 'Escape'){ if (state.sel || state.edge != null){ state.sel = null; state.edge = null; computeFocus(); renderInspector(); } else clearAll(); }
    else if (e.key === '0') fitAll();
    else if (e.key === '+' || e.key === '=') zoomTarget = {lz:Math.min(Math.log(zMax), Math.log(cam.z)+0.5), sx:W/2, sy:H/2};
    else if (e.key === '-') zoomTarget = {lz:Math.max(Math.log(zMin), Math.log(cam.z)-0.5), sx:W/2, sy:H/2};
    else if (e.key.startsWith('Arrow') && !e.metaKey && !e.ctrlKey && !e.altKey){
      e.preventDefault();
      const fwd = e.key === 'ArrowRight' || e.key === 'ArrowDown';
      if (!e.shiftKey && state.trace){ const tr = state.trace; gotoStep(tr.cur == null ? (fwd ? 0 : tr.steps.length-1) : tr.cur + (fwd ? 1 : -1)); }           // 추적 중: 이전·다음 단계
      else if (!e.shiftKey && state.hits && state.hits.list.length){ const h = state.hits; gotoHit(h.cur == null ? (fwd ? 0 : h.list.length-1) : h.cur + (fwd ? 1 : -1)); }  // 검색 결과: 이전·다음 결과
      else if (!e.shiftKey && walkActive()){ if (e.key === 'ArrowUp') walkMove(-1); else if (e.key === 'ArrowDown') walkMove(1); else if (e.key === 'ArrowRight') walkGo(); else walkBack(); }  // 선택 중: 연결을 따라 걷기
      else { const d = 90/cam.z; cam.x += e.key === 'ArrowRight' ? d : e.key === 'ArrowLeft' ? -d : 0; cam.y += e.key === 'ArrowDown' ? d : e.key === 'ArrowUp' ? -d : 0; invalidate(); }   // 그 밖에(또는 Shift): 지도 이동
    }
  });
}

function fitAll(instant){
  const r = {x:WORLD.x0, y:WORLD.y0, w:WORLD.x1-WORLD.x0, h:WORLD.y1-WORLD.y0};
  return fitRect(r, {pad:1.06, instant});
}
function resize(){
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  const base = Math.min(W/((WORLD.x1-WORLD.x0)*1.06), H/((WORLD.y1-WORLD.y0)*1.2));
  const one = Math.min(W/(CLUSTER.w*1.06), H/(CLUSTER.h*1.2));   // 제품 하나가 화면에 맞는 배율: 단계 구분의 기준
  fitZ = base; Z_SYS = clamp(one*1.25, 0.012, 0.11); zMin = base*0.5; invalidate();
}
let lastHud = 0;
function updateHud(now){
  if (now - lastHud < 120) return; lastHud = now;
  const lv = levelOf(cam.z);
  document.querySelectorAll('#level button').forEach((b,i) => b.classList.toggle('on', b.dataset.lv != null ? i === lv : state.nav && !$('#trace').hidden && !(state.trace || state.hits || state.impact)));
  const p = pick(W/2, H/2), where = p ? `${p.s.name}${p.m ? ' › ' + p.m.name : ''}` : '빈 공간';
  $('#status').innerHTML = `<b>${esc(where)}</b><br>축척 1:${cam.z >= 1 ? (1/cam.z).toFixed(2) : Math.round(1/cam.z)} · 화면 안 유닛 ${vis.length.toLocaleString()} · 그리기 ${drawMs.toFixed(1)}ms${frameMs ? ' · 프레임 ' + frameMs.toFixed(1) + 'ms' : ''}<br>${SCALE > 1 ? `가상 복제 ×${SCALE} · 유닛 ${UNITS.length.toLocaleString()}개 · 연결 ${EDGES.length.toLocaleString()}개 · 준비 ${Math.round(loadMs)}ms<br>` : ''}<span class="hint">드래그 이동 · 휠·핀치 확대 · 클릭 설명 · 방향키 따라가기 · / 검색 · 0 전체</span>`;
}
function frame(now){
  const moving = updateCamera(now);
  const live = !reduceMotion && (focus || cam.z < Z_SYS*2.3 || (RT && show.rt) || (state.sel && state.sel.m != null && selExits().length));
  if (dirty || moving || live){ if (lastFrameT && now - lastFrameT < 250) frameMs = frameMs ? frameMs*0.9 + (now - lastFrameT)*0.1 : now - lastFrameT; lastFrameT = now; ins0 = insets(); draw(now); dirty = false; } else lastFrameT = 0;
  updateHud(now);
  requestAnimationFrame(frame);
}

/* 규모 시험: 같은 제품을 K번 복제해 지도를 키운다. 복제본은 가상 데이터이고 원본(첫 묶음)만 실제다. */
function buildRecords(K){
  const base = JSON.parse(RAW); if (K <= 1) return base;
  const meta = base.find(r => r.rt === 'meta'), units = base.filter(r => r.rt === 'unit'), edges = base.filter(r => r.rt === 'edge'), n = units.length;
  const out = base.slice(), sysBase = meta.systems.slice();
  const he = edges.find(e => e.k === 'http'), de = edges.find(e => e.k === 'db' && e.ops);
  for (let k = 1; k < K; k++){
    const off = k*n, tag = '@' + k;
    for (const s of sysBase) meta.systems.push({id:s.id + tag, name:s.name, sub:`가상 복제 ${k+1}`, base:s.id});
    for (const u of units){
      const cu = {...u, i:u.i + off, id:u.id + tag, sys:u.sys + tag};
      if (u.m) cu.m = u.m.map(m => { const x = {...m}; if (m.c) x.c = m.c.map(([t,tm]) => [t+off, tm]); if (m.h) x.h = m.h.map(([t,tm,lab]) => [t+off, tm, lab]); if (m.db) x.db = m.db.map(([t,op]) => [t+off, op]); return x; });
      out.push(cu);
    }
    for (const e of edges) out.push({...e, s:e.s + off, t:e.t + off});
    if (he) out.push({rt:'edge', s:he.s + off, t:he.t + off - n, k:'http', w:1, routes:(he.routes||[]).slice(0,1)});   // 묶음끼리 잇는 가상 연동
    if (de) out.push({rt:'edge', s:de.s + off, t:de.t + off - n, k:'db', w:1, ops:'r'});
  }
  return out;
}
function load(K){
  const t0 = performance.now();
  SCALE = K; cancelAI(); NAV.hist = []; state.edge = null; state.hoverEdge = null; state.walk = null; lastEdges = []; lastBright = [];
  UNITS = []; EDGES = []; SYS = {}; SYSL = []; MODS = []; MODE = []; SYSE = []; ADJ = []; byId.clear(); bySlug.clear(); AI.index = null;
  state.sel = state.trace = state.hits = state.impact = null; focus = null; vis = []; anim = null; inertia = null; zoomTarget = null;
  prepare(buildRecords(K)); layout();
  { const bn = $('#brand-name'); if (bn) bn.textContent = String(META.repo || 'ATLAS').toUpperCase(); try { document.title = (META.repo ? META.repo + ' · ' : '') + '코드 아틀라스'; } catch (e){} }
  for (const u of UNITS) u.openN = u.m.reduce((a,m) => a + (m.open ? 1 : 0), 0);
  for (const s of SYSL){ s.nm = s.units.reduce((a,u) => a+u.m.length, 0); s.open = s.units.reduce((a,u) => a + u.openN, 0); s.routes = s.units.reduce((a,u) => a + u.m.filter(m => m.route).length, 0); }
  applyFindings();
  computeGeo();
  buildIndex(); renderTrace(); renderPending(); renderInspector(); $('#q').value = ''; $('#qclear').hidden = true;
  resize(); fitAll(true);
  const nm = UNITS.reduce((a,u) => a+u.m.length, 0);
  $('#stats').innerHTML = `<b>${SYSL.length}</b> SYSTEMS · <b>${MODS.length.toLocaleString()}</b> MODULES · <b>${UNITS.length.toLocaleString()}</b> UNITS<br><b>${nm.toLocaleString()}</b> METHODS · <b>${EDGES.length.toLocaleString()}</b> EDGES${K > 1 ? ' · 가상 복제 ×' + K : ''}${(META.sources || []).length ? `<br>기준 ${META.sources.map(x => esc(x.name) + (x.commit ? ' ' + esc(x.branch) + '@' + esc(x.commit) + (x.dirty ? '+수정' : '') : '')).join(' · ')} · ${esc(META.analyzed || '')}` : ''}<span id="manline"></span>`;
  renderManifest(); applyRuntime(RT_RAW); renderWalk();
  document.querySelectorAll('#scale button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.scale === K)));
  if (needPin && UNITS.length) savePositions(true);       // 새로 놓인 시스템의 자리를 기억해 둔다
  loadMs = performance.now() - t0; frameMs = 0; invalidate();
}
async function boot(){
  RAW = await (await fetch('atlas-data.json')).text();
  try { const r = await fetch('atlas-notes.json', {cache:'no-cache'}); if (r.ok) applyNotes(await r.json()); } catch (e){}
  await initApi();
  POS = WSPOS || (API.ok ? null : (() => { try { return JSON.parse(localStorage.getItem(posKey) || 'null'); } catch (e){ return null; } })());
  loadLocal(); load(1); bindInput();
  if (API.ok && !UNITS.length) openConfig();
  $('#boot').remove();
  addEventListener('resize', () => { resize(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(invalidate);
  requestAnimationFrame(frame);
  addEventListener('hashchange', applyHash); applyHash();
  initAI();
  checkManifest(true); setInterval(() => checkManifest(false), 60000);
  checkRuntime(); setInterval(checkRuntime, 10000);
}
/* 시험용 손잡이: 주소에 ?debug 를 붙여 열었을 때만 안쪽 상태를 내놓는다 (tests/ui-check.js 가 쓴다) */
if (/[?&]debug\b/.test(location.search)) window.__T = {cam, API, CFG, get state(){ return state; }, get UNITS(){ return UNITS; }, get EDGES(){ return EDGES; }, get SYS(){ return SYS; }, get SYSL(){ return SYSL; }, get META(){ return META; }, get POS(){ return POS; }};
boot().catch(err => { $('#boot').textContent = '데이터를 불러오지 못했습니다: ' + err.message; });
})();
